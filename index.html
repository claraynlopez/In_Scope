<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Scope Timeline</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>    
    <nav class="menu">
        <a href="index.html" class="menu-item">Home</a>
        <a href="#calculator-section" class="menu-item" id="calculator-link">Calculator</a>
    </nav>

    <div class="container">
        <div class="scope-block">
            <p class="title">SCOPE DATE LIMIT</p>
            <p class="subtitle">Based on the first day: May 28, 2025</p>
            <p id="resultat" class="scopeDate"></p>

        </div>
                
        <div class="upcoming-events">
            <h2 class="events-title">Upcoming Events</h2>
            <div class="events-container">
                <div class="event-widget">
                    <div class="event-day-name">THURSDAY</div>
                    <div class="event-day-number">28</div>
                    <div class="event-month">NOV</div>
                    <div class="event-description">Six Month Anniversary</div>
                </div>
                
                <div class="event-widget">
                    <div class="event-day-name">WEDNESDAY</div>
                    <div class="event-day-number">25</div>
                    <div class="event-month">DEC</div>
                    <div class="event-description">Christmas 🎄</div>
                </div>
                
                <div class="event-widget">
                    <div class="event-day-name">MONDAY</div>
                    <div class="event-day-number">2</div>
                    <div class="event-month">FEB</div>
                    <div class="event-description">Dani's 22nd Birthday 🎂</div>
                </div>
            </div>
        </div>
                

        <div class="calculator" id ="calculator-section">
            <h2>Custom Scope Calculator</h2>
            
            <div class="calculator-form">
                <label for="start-date">Start date:</label>
                <input type="date" id="start-date" class="date-input">
                
                <label for="current-date">Target date:</label>
                <input type="date" id="current-date" class="date-input">
                
                <button onclick="calculateScope()" class="btn-calculate">
                    Calcular Scope
                </button>
                
                <div id="calculator-result" class="calculator-result"></div>
            </div>
        </div>
    </div>

    <script>
        // ==============================
        // PART 1: Data límit principal
        // ==============================
        const firstDay = new Date(2025, 4, 28);
        firstDay.setHours(0,0,0,0);

        // Javascript a través del rellotge intern del SO obté la data actual i hora
        const today = new Date(); 
        today.setHours(0,0,0,0);

        const timeDiff = today - firstDay;
        const daysDiff = Math.floor(timeDiff / (1000 * 60 * 60 * 24));

        const limitDay = new Date(today.getTime() + (daysDiff * 24 * 60 * 60 * 1000));         
        const lastDay = limitDay.toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });
        document.getElementById('resultat').textContent = lastDay;
        // ==============================
        // Scope meaning
        // ============================== 


        // ==============================
        // PART 2: Calculadora de Scope
        // ==============================
        // Data actual per defecte al datepicker
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        const todayStr = `${year}-${month}-${day}`;

        document.getElementById('current-date').value = todayStr;
        document.getElementById('start-date').value = '2025-05-28';

        function calculateScope() {
            const startDateInput = document.getElementById('start-date').value;
            const currentDateInput = document.getElementById('current-date').value;
            
            if (!startDateInput || !currentDateInput) {
                alert('Please, select both dates.');
                return;
            }
            
            const startDate = new Date(startDateInput);
            startDate.setHours(0, 0, 0, 0);
            
            const currentDate = new Date(currentDateInput);
            currentDate.setHours(0, 0, 0, 0);
            
            if (startDate > currentDate) {
                alert('The start date must be earlier than the current date.');
                return;
            }
            
            const timeDiff = currentDate - startDate;
            const daysDiff = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
            
            const limitDate = new Date(currentDate.getTime() + (daysDiff * 24 * 60 * 60 * 1000));
            
            const limitFormatted = limitDate.toLocaleDateString('en', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            
            const resultHTML = `
                <div class="result-card">
                <h3>Results</h3>
                <p><strong>Days elapsed:</strong> ${daysDiff} days</p>
                <p><strong>Scope deadline:</strong> ${limitFormatted}</p>
                <p class="result-explanation">
                    From the start date until today, ${daysDiff} days have passed.
                    Your Scope extends ${daysDiff} more days into the future from today.
                </p>
                </div>
            `;
            
            document.getElementById('calculator-result').innerHTML = resultHTML;
        }
        // ==============================
        // PART 3: Scroll suau
        // ==============================
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });

    </script>
</body>
</html>
